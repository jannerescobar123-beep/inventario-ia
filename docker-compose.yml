# Opcional: levanta backend + Ollama con Docker.
# El frontend se sigue ejecutando con `npm run dev` en el host.
services:
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - OLLAMA_URL=http://ollama:11434
      - OLLAMA_MODEL=llama3.2:3b
    volumes:
      - backend_data:/app/data
    depends_on:
      - ollama

volumes:
  ollama_data:
  backend_data:
