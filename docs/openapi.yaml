openapi: 3.0.3
info:
  title: Inventario-IA API
  version: 0.3.0
  description: >
    Contrato acordado entre Persona A (backend) y Persona B (frontend).
    Sincronizado con la implementación real (backend/api/main.py) en v0.3.
    REGLA: cualquier cambio aquí debe registrarse como ADR en el repositorio
    inventario-ia-docs y avisarse el mismo día (ver ADR-004).
servers:
  - url: http://localhost:8000
    description: Desarrollo local
tags:
  - name: Sistema
  - name: Importación
  - name: Productos
  - name: Análisis
  - name: Alertas
  - name: Chat IA
paths:
  /:
    get:
      tags: [Sistema]
      summary: Identidad del servicio
      responses:
        '200':
          description: OK
  /health:
    get:
      tags: [Sistema]
      summary: Estado del servicio (API + base de datos)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Estado' }
  /api/importar:
    post:
      tags: [Importación]
      summary: Importa un archivo Excel (.xlsx/.xls) o CSV de ventas
      description: >
        ADR-003: si el libro trae una hoja "productos" se importa primero el
        catálogo y luego la hoja "ventas".
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: Archivo subido en el campo 'file'
      responses:
        '200':
          description: Resumen de la importación
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResumenImportacion' }
        '400':
          description: Formato no soportado, campo 'file' ausente o columnas no reconocidas
  /api/productos:
    get:
      tags: [Productos]
      summary: Lista de productos
      responses:
        '200':
          description: Lista de productos ordenada por nombre
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Producto' }
    post:
      tags: [Productos]
      summary: Alta manual de un producto (RF-07)
      description: >
        Si no se envía 'sku' se genera uno único a partir del nombre. Un SKU
        repetido devuelve 409 en lugar de sobrescribir el producto existente.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductoEntrada' }
      responses:
        '201':
          description: Producto creado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Producto' }
        '409':
          description: Ya existe un producto con ese SKU
        '422':
          description: Cuerpo inválido (nombre vacío, precio o stock negativos)
  /api/productos/{producto_id}:
    put:
      tags: [Productos]
      summary: Edición manual de un producto (RF-07)
      description: >
        Sustituye los campos editables. Si no se envía 'sku' se conserva el
        actual; un SKU que pertenezca a otro producto devuelve 409.
      parameters:
        - name: producto_id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductoEntrada' }
      responses:
        '200':
          description: Producto actualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Producto' }
        '404':
          description: Producto no encontrado
        '409':
          description: El SKU pertenece a otro producto
        '422':
          description: Cuerpo inválido (nombre vacío, precio o stock negativos)
  /api/productos/{producto_id}/proveedor:
    put:
      tags: [Productos]
      summary: Asignar o quitar el proveedor de un producto (RF-43)
      description: >
        `proveedor_id: null` deja el producto sin proveedor (vuelve al lead
        time global de 7 días). Un proveedor inexistente devuelve 404 y uno
        dado de baja, 409.
      parameters:
        - name: producto_id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AsignacionProveedor' }
      responses:
        '200':
          description: Producto con el proveedor asignado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Producto' }
        '404':
          description: Producto o proveedor no encontrado
        '409':
          description: El proveedor está dado de baja
  /api/proveedores:
    get:
      tags: [Proveedores]
      summary: Lista de proveedores (RF-43)
      parameters:
        - name: solo_activos
          in: query
          required: false
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: Proveedores ordenados por nombre
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Proveedor' }
    post:
      tags: [Proveedores]
      summary: Alta de un proveedor (RF-43)
      description: >
        El nombre es único sin distinguir tildes ni mayúsculas; un duplicado
        devuelve 409.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProveedorEntrada' }
      responses:
        '201':
          description: Proveedor creado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Proveedor' }
        '409':
          description: Ya existe un proveedor con ese nombre
        '422':
          description: Cuerpo inválido (nombre vacío o lead time fuera de 1-365 días)
  /api/proveedores/{proveedor_id}:
    put:
      tags: [Proveedores]
      summary: Edición de un proveedor (RF-43)
      description: >
        `activo: true` reactiva un proveedor dado de baja. Si `activo` no se
        envía, se conserva el estado actual. Los demás campos tienen semántica
        PUT: `contacto` y `telefono` omitidos se guardan como `null`.
      parameters:
        - name: proveedor_id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProveedorEntrada' }
      responses:
        '200':
          description: Proveedor actualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Proveedor' }
        '404':
          description: Proveedor no encontrado
        '409':
          description: El nombre pertenece a otro proveedor
        '422':
          description: Cuerpo inválido
    delete:
      tags: [Proveedores]
      summary: Baja lógica de un proveedor (RF-43)
      description: >
        Marca `activo = 0`. No borra la fila ni limpia la asignación de sus
        productos: los productos vuelven al lead time global y el proveedor se
        puede reactivar con PUT.
      parameters:
        - name: proveedor_id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Proveedor dado de baja
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Proveedor' }
        '404':
          description: Proveedor no encontrado
  /api/kpis:
    get:
      tags: [Análisis]
      summary: KPIs generales del negocio (RF-09)
      responses:
        '200':
          description: KPIs calculados sobre SQLite
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KPIs' }
  /api/rotacion:
    get:
      tags: [Análisis]
      summary: Rotación por producto, baja rotación y productos sin ventas (RF-11 a RF-13)
      description: >
        La ventana de venta por defecto es de 30 días anclada en la última
        venta registrada. dias_cobertura = stock / venta_diaria_media (null si
        no hay ventas en la ventana).
      responses:
        '200':
          description: Datos de rotación
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Rotacion' }
  /api/predicciones/{producto_id}:
    get:
      tags: [Análisis]
      summary: Predicción de demanda de un producto para 7, 14 y 30 días (RF-18 a RF-20)
      parameters:
        - { in: path, name: producto_id, required: true, schema: { type: integer } }
      responses:
        '200':
          description: Predicción por media móvil simple
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Prediccion' }
        '400':
          description: Histórico de ventas insuficiente para el producto
        '404':
          description: Producto no encontrado
  /api/recomendaciones:
    get:
      tags: [Análisis]
      summary: Lista de compra sugerida para esta semana (RF-22 a RF-27)
      parameters:
        - { in: query, name: lead_time, schema: { type: integer, default: 7 }, description: Días de entrega del proveedor }
      responses:
        '200':
          description: Recomendaciones ordenadas por urgencia
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Recomendaciones' }
  /api/ordenes-compra:
    get:
      tags: [Análisis]
      summary: Orden de compra en JSON (RF-27)
      description: >
        Los mismos datos que /api/recomendaciones con forma de pedido: cabecera
        fechada, líneas numeradas y totales.
      parameters:
        - { in: query, name: lead_time, schema: { type: integer, default: 7 }, description: Días de entrega del proveedor }
      responses:
        '200':
          description: Orden de compra
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrdenCompra' }
  /api/ordenes-compra.csv:
    get:
      tags: [Análisis]
      summary: Orden de compra en CSV para Excel (RF-27)
      description: >
        UTF-8 con BOM y separador ';': Excel en español abre el archivo con las
        columnas separadas y las tildes correctas.
      parameters:
        - { in: query, name: lead_time, schema: { type: integer, default: 7 }, description: Días de entrega del proveedor }
      responses:
        '200':
          description: Archivo CSV (se descarga)
          content:
            text/csv:
              schema: { type: string }
  /api/ordenes-compra.html:
    get:
      tags: [Análisis]
      summary: Orden de compra imprimible (RF-27)
      description: >
        Documento A4 con CSS de impresión: «Imprimir» produce el PDF desde el
        navegador, sin dependencias ni conexión.
      parameters:
        - { in: query, name: lead_time, schema: { type: integer, default: 7 }, description: Días de entrega del proveedor }
      responses:
        '200':
          description: Documento HTML listo para imprimir
          content:
            text/html:
              schema: { type: string }
  /api/abc:
    get:
      tags: [Análisis]
      summary: Clasificación ABC del inventario (RF-15)
      description: A = 80% del valor, B = 15%, C = 5%, sobre stock * precio de venta.
      responses:
        '200':
          description: Productos agrupados por clase
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ABC' }
  /api/capital:
    get:
      tags: [Análisis]
      summary: Capital inmovilizado en inventario por producto (RF-17)
      responses:
        '200':
          description: Capital inmovilizado (stock * costo)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Capital' }
  /api/estacionalidad:
    get:
      tags: [Análisis]
      summary: Detectar patrones estacionales de ventas (RF-14)
      parameters:
        - { in: query, name: producto, schema: { type: string }, description: Nombre opcional para analizar un solo producto }
      responses:
        '200':
          description: Estacionalidad detectada (o "sin_datos"/"insuficiente_datos")
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Estacionalidad' }
  /api/tendencias:
    get:
      tags: [Análisis]
      summary: Serie de ventas por día, semana o mes (RF-10)
      description: >
        Los periodos sin ventas aparecen con cero: un día que no se vendió es
        información, no un hueco. Las semanas son ISO (lunes a domingo). La
        serie se ancla en la última venta registrada, no en la fecha del equipo.
      parameters:
        - { in: query, name: granularidad, schema: { type: string, enum: [dia, semana, mes], default: mes }, description: 'Agrupación de la serie' }
        - { in: query, name: desde, schema: { type: string, format: date }, description: 'Fecha inicial AAAA-MM-DD (opcional)' }
        - { in: query, name: hasta, schema: { type: string, format: date }, description: 'Fecha final AAAA-MM-DD (opcional)' }
      responses:
        '200':
          description: Serie de ventas y resumen de tendencia
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tendencias' }
        '400':
          description: Granularidad inválida o rango de fechas invertido
  /api/comparacion:
    get:
      tags: [Análisis]
      summary: Comparar el periodo actual con otro (RF-16)
      description: >
        Si el periodo de referencia no tiene ventas, devuelve
        `disponible: false` con el motivo, en lugar de un 0 % que parecería
        una caída real.
      parameters:
        - { in: query, name: tipo, schema: { type: string, enum: [semana, mes], default: semana }, description: 'Periodo a comparar' }
        - { in: query, name: contra, schema: { type: string, enum: [anterior, anio_anterior], default: anterior }, description: 'Periodo de referencia; anio_anterior solo aplica a tipo=mes' }
      responses:
        '200':
          description: Comparación de periodos
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Comparacion' }
        '400':
          description: Tipo o referencia inválidos
  /api/alertas:
    get:
      tags: [Alertas]
      summary: Alertas de riesgo de agotamiento y comportamientos inusuales (RF-28, RF-29)
      description: >
        Incluye además `exceso_stock` (productos por encima de su stock máximo,
        RF-42) y, en cada alerta de agotamiento, el umbral aplicado
        (`umbral_margen`, `umbral_dias`) resuelto por producto o categoría (RF-30).
      responses:
        '200':
          description: Alertas agrupadas por tipo
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Alertas' }
  /api/umbrales:
    get:
      tags: [Alertas]
      summary: Configuración efectiva de los umbrales de alerta (RF-30)
      description: >
        Valores de fábrica (margen 1.5, 7 días de inminente) y, por categoría, lo
        que hay configurado. Los umbrales propios de un producto se ven en
        /api/productos.
      responses:
        '200':
          description: Umbrales de fábrica y configuración por categoría
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Umbrales' }
  /api/umbrales/{categoria}:
    put:
      tags: [Alertas]
      summary: Configurar los umbrales de alerta de una categoría (RF-30)
      description: >
        Un campo en null devuelve ese umbral al valor de fábrica; si los dos van
        en null, la categoría deja de tener configuración propia. La categoría se
        compara sin distinguir mayúsculas ni tildes.
      parameters:
        - name: categoria
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UmbralCategoriaEntrada' }
      responses:
        '200':
          description: Configuración guardada (o restablecida a los valores de fábrica)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UmbralCategoria' }
        '404':
          description: Ningún producto usa esa categoría (evita configuraciones fantasma)
        '422':
          description: Umbral inválido (días menores que 1 o margen no positivo)
  /api/chat:
    post:
      tags: [Chat IA]
      summary: Pregunta al asistente con IA local (Ollama)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChatRequest' }
      responses:
        '200':
          description: Respuesta del asistente (siempre 200; si Ollama no responde, la respuesta explica el fallo y adjunta el contexto JSON)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChatResponse' }
        '400':
          description: Cuerpo ausente o mensaje vacío
components:
  schemas:
    Estado:
      type: object
      properties:
        status: { type: string, example: 'ok' }
        database: { type: string, example: 'connected' }
    Producto:
      type: object
      properties:
        id: { type: integer }
        sku: { type: string, nullable: true }
        nombre: { type: string }
        categoria: { type: string, nullable: true }
        unidad: { type: string, nullable: true, description: 'Unidad de medida (kg, unidad, caja...) — RF-07' }
        costo: { type: number, nullable: true }
        precio_venta: { type: number, nullable: true }
        stock_actual: { type: number }
        stock_minimo: { type: number }
        stock_maximo: { type: integer, nullable: true, description: 'Máximo de stock; null = sin máximo (RF-42)' }
        dias_alerta_inminente: { type: integer, nullable: true, description: 'Días de cobertura por debajo de los cuales la alerta es inminente; null = hereda de su categoría o de fábrica (RF-30)' }
        margen_alerta: { type: number, nullable: true, description: 'Multiplicador del stock mínimo para alertar; null = hereda de su categoría o de fábrica (RF-30)' }
        proveedor_id: { type: integer, nullable: true, description: 'Proveedor asignado; null = sin proveedor y lead time global (RF-43)' }
        proveedor: { type: string, nullable: true, description: 'Nombre del proveedor asignado (RF-43)' }
        lead_time_proveedor: { type: integer, nullable: true, description: 'Lead time del proveedor asignado en días; null si el producto no tiene proveedor (RF-43)' }
      required: [id, nombre]
    KPIs:
      type: object
      properties:
        ventas_totales: { type: number }
        ticket_promedio: { type: number }
        unidades_vendidas: { type: integer }
        margen_total: { type: number }
        top_productos:
          type: array
          items: { type: object }
    Rotacion:
      type: object
      properties:
        productos:
          type: array
          description: Uno por producto del catálogo
          items:
            type: object
            properties:
              id: { type: integer }
              nombre: { type: string }
              stock_actual: { type: number }
              total_vendido: { type: integer, description: Histórico de unidades vendidas }
              total_vendido_30d: { type: integer, description: Unidades vendidas en la ventana (30 días por defecto) }
              dias_desde_ultima_venta: { type: integer, nullable: true }
              indice_rotacion: { type: number, description: Unidades/mes normalizado a 30 días }
              dias_cobertura: { type: number, nullable: true, description: stock / venta_diaria_media; null si no hay ventas en la ventana }
        baja_rotacion:
          type: array
          items:
            type: object
            properties:
              id: { type: integer }
              nombre: { type: string }
              stock_actual: { type: number }
              razon: { type: string, enum: [sin_ventas, baja_rotacion] }
        muertos:
          type: array
          description: Nombres sin ventas registradas nunca
          items: { type: string }
    Prediccion:
      type: object
      properties:
        producto_id: { type: integer }
        producto: { type: string }
        predicciones:
          type: object
          properties:
            '7_dias': { type: integer }
            '14_dias': { type: integer }
            '30_dias': { type: integer }
        metodo: { type: string, example: media_movil_simple }
        historico_dias: { type: integer }
        ultima_actualizacion: { type: string, format: date-time }
    Recomendaciones:
      type: object
      properties:
        recomendaciones:
          type: array
          items: { $ref: '#/components/schemas/Recomendacion' }
        total_analizados: { type: integer }
        total_recomendado: { type: integer }
        lead_time_asumido: { type: integer }
        fecha_referencia_demanda: { type: string, format: date }
    Recomendacion:
      type: object
      properties:
        producto_id: { type: integer }
        producto: { type: string }
        stock_actual: { type: number }
        stock_minimo: { type: number }
        demanda_proyectada: { type: integer }
        cantidad_sugerida: { type: integer }
        punto_reorden: { type: integer }
        punto_reorden_detalle: { type: string }
        urgencia: { type: string, enum: [crítico, medio, bajo] }
        fecha_sugerida: { type: string, format: date }
        fecha_entrega_estimada: { type: string, format: date }
        valor_inventario: { type: number }
        costo_unitario: { type: number, description: 'Coste de compra por unidad, tomado del catálogo (RF-27)' }
        costo_total_estimado: { type: number, description: 'costo_unitario x cantidad_sugerida (RF-27)' }
        lead_time_dias: { type: integer }
        proveedor_id: { type: integer, nullable: true, description: 'Proveedor del producto; null = sin proveedor (RF-43)' }
        proveedor: { type: string, nullable: true, description: 'Nombre del proveedor del producto; null = sin proveedor (RF-43)' }
    OrdenCompra:
      type: object
      description: Orden de compra (RF-27)
      properties:
        titulo: { type: string, example: 'Orden de compra' }
        fecha_emision: { type: string, format: date }
        lead_time_dias: { type: integer, description: 'Días de entrega asumidos al calcular la orden' }
        fecha_referencia_demanda: { type: string, nullable: true, format: date }
        lineas:
          type: array
          items:
            type: object
            properties:
              num: { type: integer }
              producto: { type: string }
              proveedor: { type: string, nullable: true, description: 'Proveedor real de la línea (RF-43); null = sin asignar' }
              cantidad: { type: integer }
              urgencia: { type: string, enum: [crítico, medio, bajo] }
              fecha_sugerida: { type: string, format: date }
              fecha_entrega_estimada: { type: string, format: date }
              stock_actual: { type: integer }
              punto_reorden: { type: integer }
              costo_unitario: { type: number }
              costo_total_estimado: { type: number }
        grupos:
          type: array
          description: 'Líneas agrupadas por proveedor real, con subtotales (RF-43)'
          items:
            type: object
            properties:
              proveedor_id: { type: integer, nullable: true }
              proveedor: { type: string, nullable: true, description: 'null = líneas sin proveedor asignado' }
              lead_time_dias: { type: integer, nullable: true }
              lineas:
                type: array
                items: { type: object }
              totales:
                type: object
                properties:
                  productos: { type: integer }
                  unidades: { type: integer }
                  costo_total_estimado: { type: number }
        totales:
          type: object
          properties:
            productos: { type: integer }
            unidades: { type: integer }
            costo_total_estimado: { type: number }
    ABC:
      type: object
      properties:
        clases:
          type: object
          description: Claves A, B y C; cada una con su lista de productos
          properties:
            A: { type: array, items: { type: object } }
            B: { type: array, items: { type: object } }
            C: { type: array, items: { type: object } }
        total_productos: { type: integer }
        total_valor_inventario: { type: number }
    Capital:
      type: object
      properties:
        por_producto:
          type: object
          additionalProperties:
            type: object
            properties:
              stock: { type: number }
              costo_unitario: { type: number }
              precio_venta: { type: number }
              capital: { type: number }
        total_capital_inmovilizado: { type: number }
    Estacionalidad:
      type: object
      properties:
        estacional: { type: boolean }
        patron: { type: string, example: 'peak_en_mes_10' }
        promedios_mensuales:
          type: object
          additionalProperties: { type: number }
    Tendencias:
      type: object
      description: Serie de ventas por periodo y resumen de tendencia (RF-10)
      properties:
        granularidad: { type: string, enum: [dia, semana, mes] }
        desde: { type: string, format: date, description: 'Inicio del primer periodo devuelto' }
        hasta: { type: string, format: date }
        ancla: { type: string, format: date, description: 'Última venta registrada; la serie se ancla aquí' }
        ventana_solicitada:
          type: object
          description: 'Ventana pedida, antes de recortar los extremos sin ventas'
          properties:
            desde: { type: string, format: date }
            hasta: { type: string, format: date }
        puntos:
          type: array
          items:
            type: object
            properties:
              periodo: { type: string, example: '2026-W45' }
              etiqueta: { type: string, example: 'Sem 45 · 2 nov–8 nov' }
              unidades: { type: integer }
              ingresos: { type: number }
              num_ventas: { type: integer }
              precio_medio_unidad: { type: number, nullable: true, description: 'ingresos / unidades' }
              ingresos_por_venta: { type: number, nullable: true, description: 'ingresos / número de ventas' }
              variacion_unidades_pct: { type: number, nullable: true, description: 'Variación frente al periodo anterior de la serie' }
        resumen:
          type: object
          properties:
            periodos: { type: integer }
            unidades_totales: { type: integer }
            ingresos_totales: { type: number }
            media_unidades_por_periodo: { type: number }
            pendiente_unidades_por_periodo: { type: number }
            pendiente_relativa_pct: { type: number }
            direccion: { type: string, enum: [sube, baja, estable] }
    Comparacion:
      type: object
      description: Comparación de dos periodos (RF-16)
      properties:
        disponible: { type: boolean, description: 'false si el periodo de referencia no tiene ventas' }
        motivo: { type: string, nullable: true }
        tipo: { type: string, enum: [semana, mes] }
        contra: { type: string, enum: [anterior, anio_anterior] }
        actual: { $ref: '#/components/schemas/ComparacionPeriodo' }
        referencia: { $ref: '#/components/schemas/ComparacionPeriodo' }
        completo: { type: boolean, description: 'false si el periodo actual está en curso' }
        dias_con_datos: { type: integer }
        dias_totales_periodo: { type: integer }
        nota: { type: string, nullable: true }
        variacion:
          type: object
          nullable: true
          properties:
            unidades: { type: integer }
            unidades_pct: { type: number, nullable: true }
            ingresos: { type: number }
            ingresos_pct: { type: number, nullable: true }
            num_ventas: { type: integer }
            num_ventas_pct: { type: number, nullable: true }
    ComparacionPeriodo:
      type: object
      properties:
        periodo: { type: string, example: '2026-11' }
        etiqueta: { type: string, example: 'nov 2026' }
        desde: { type: string, format: date }
        hasta: { type: string, format: date }
        unidades: { type: integer }
        ingresos: { type: number }
        num_ventas: { type: integer }
        precio_medio_unidad: { type: number, nullable: true }
        ingresos_por_venta: { type: number, nullable: true }
        tiene_datos: { type: boolean }
    Alertas:
      type: object
      properties:
        riesgo_agotamiento:
          type: array
          items:
            type: object
            properties:
              producto_id: { type: integer }
              producto: { type: string }
              stock_actual: { type: number }
              stock_minimo: { type: number }
              riesgo: { type: string, enum: [agotamiento_inminente, agotamiento_pronto] }
              dias_estimados: { type: integer, nullable: true }
              umbral_margen: { type: number, description: 'Margen aplicado a este producto: el suyo, el de su categoría o 1.5 (RF-30)' }
              umbral_dias: { type: integer, description: 'Días de cobertura que marcan "inminente": los suyos, los de su categoría o 7 (RF-30)' }
              valor_inventario: { type: number }
        exceso_stock:
          type: array
          description: Productos por encima de su stock máximo (RF-42); vacío si nadie tiene máximo
          items:
            type: object
            properties:
              producto_id: { type: integer }
              producto: { type: string }
              stock_actual: { type: number }
              stock_maximo: { type: number }
              exceso_unidades: { type: integer }
              capital_inmovilizado: { type: number, description: 'Unidades de más valoradas a precio de venta' }
        comportamiento:
          type: object
          description: Resultado del análisis de anomalías (picos/caídas)
          properties:
            alerta: { type: boolean }
            media_diaria: { type: number }
            desviacion_std: { type: number }
            picos_detectados: { type: integer }
            caidas_detectadas: { type: integer }
    ResumenImportacion:
      type: object
      properties:
        archivo_origen: { type: string }
        total_ventas: { type: integer, description: Ventas importadas }
        productos_creados: { type: integer, description: 'Productos creados desde la hoja "productos" o desde las ventas' }
        productos_actualizados: { type: integer, description: 'Productos actualizados desde la hoja "productos"' }
        ventas_duplicadas_omitidas: { type: integer, description: 'Ventas ya presentes en la BD que no se volvieron a insertar (RF-05)' }
        errores:
          type: array
          items: { type: string }
    ChatRequest:
      type: object
      properties:
        mensaje: { type: string }
        historial:
          type: array
          description: Mensajes anteriores de la conversación (opcional; se usan los últimos 6)
          items:
            type: object
            properties:
              rol: { type: string, enum: [usuario, asistente] }
              contenido: { type: string }
      required: [mensaje]
    ChatResponse:
      type: object
      properties:
        respuesta: { type: string }
        herramientas:
          type: object
          description: Datos reales usados como contexto (KPIs, recomendaciones, alertas)
        contexto: { type: object }
        modelo: { type: string, nullable: true, example: 'qwen3:1.7b', description: 'null si Ollama no respondió' }
    ProductoEntrada:
      type: object
      description: Cuerpo de alta o edición manual de un producto (RF-07)
      properties:
        nombre: { type: string, minLength: 1, maxLength: 200 }
        sku: { type: string, nullable: true, description: 'Si se omite en el alta se genera uno único' }
        categoria: { type: string, nullable: true }
        unidad: { type: string, nullable: true }
        costo: { type: number, minimum: 0, default: 0 }
        precio_venta: { type: number, minimum: 0, default: 0 }
        stock_actual: { type: integer, minimum: 0, default: 0 }
        stock_minimo: { type: integer, minimum: 0, default: 0 }
        stock_maximo: { type: integer, minimum: 0, nullable: true, default: null, description: 'RF-42. En la edición solo se sobrescribe si se envía' }
        dias_alerta_inminente: { type: integer, minimum: 1, nullable: true, default: null, description: 'RF-30. En la edición solo se sobrescribe si se envía' }
        margen_alerta: { type: number, exclusiveMinimum: 0, nullable: true, default: null, description: 'RF-30. En la edición solo se sobrescribe si se envía' }
        proveedor_id: { type: integer, minimum: 1, nullable: true, default: null, description: 'RF-43. En la edición solo se sobrescribe si se envía; null quita el proveedor' }
      required: [nombre]
    UmbralCategoriaEntrada:
      type: object
      description: Configuración de umbrales de una categoría (RF-30). Un campo en null vuelve al valor de fábrica
      properties:
        dias_alerta_inminente: { type: integer, minimum: 1, nullable: true }
        margen_alerta: { type: number, exclusiveMinimum: 0, nullable: true }
    Umbrales:
      type: object
      properties:
        por_defecto:
          type: object
          properties:
            dias_inminente: { type: integer, example: 7 }
            margen: { type: number, example: 1.5 }
        categorias:
          type: array
          items:
            type: object
            properties:
              categoria: { type: string }
              dias_inminente: { type: integer, description: 'Valor efectivo (configurado o de fábrica)' }
              margen: { type: number, description: 'Valor efectivo (configurado o de fábrica)' }
              propio_dias_inminente: { type: integer, nullable: true, description: 'null si la categoría no lo configura' }
              propio_margen: { type: number, nullable: true, description: 'null si la categoría no lo configura' }
    UmbralCategoria:
      type: object
      description: Resultado de configurar una categoría (RF-30)
      properties:
        categoria: { type: string }
        dias_inminente: { type: integer }
        margen: { type: number }
        configurada: { type: boolean, description: 'false cuando la categoría vuelve a los valores de fábrica' }
    Proveedor:
      type: object
      description: Proveedor con su tiempo de entrega (RF-43)
      properties:
        id: { type: integer }
        nombre: { type: string }
        lead_time_dias: { type: integer, minimum: 1, maximum: 365 }
        contacto: { type: string, nullable: true }
        telefono: { type: string, nullable: true }
        activo: { type: boolean, description: 'false tras una baja lógica; sus productos vuelven al lead time global' }
        fecha_creacion: { type: string, format: date-time }
        productos_asignados: { type: integer, description: 'Productos del catálogo con este proveedor' }
      required: [id, nombre, lead_time_dias, activo]
    ProveedorEntrada:
      type: object
      description: Cuerpo de alta o edición de un proveedor (RF-43)
      properties:
        nombre: { type: string, minLength: 1, maxLength: 200 }
        lead_time_dias: { type: integer, minimum: 1, maximum: 365, default: 7 }
        contacto: { type: string, nullable: true }
        telefono: { type: string, nullable: true }
        activo: { type: boolean, nullable: true, description: 'Solo en PUT: true reactiva un proveedor dado de baja; si no se envía, no cambia' }
      required: [nombre]
    AsignacionProveedor:
      type: object
      description: Asignación de proveedor a un producto (RF-43); null = sin proveedor
      properties:
        proveedor_id: { type: integer, minimum: 1, nullable: true, default: null }
