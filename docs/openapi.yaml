openapi: 3.0.3
info:
  title: Inventario-IA API
  version: 0.3.0
  description: >
    Contrato acordado entre Persona A (backend) y Persona B (frontend).
    Sincronizado con la implementación real (backend/api/main.py) en v0.3.
    REGLA: cualquier cambio aquí debe registrarse como ADR en el repositorio
    inventario-ia-docs y avisarse el mismo día (ver ADR-004).
servers:
  - url: http://localhost:8000
    description: Desarrollo local
tags:
  - name: Sistema
  - name: Importación
  - name: Productos
  - name: Análisis
  - name: Alertas
  - name: Chat IA
paths:
  /:
    get:
      tags: [Sistema]
      summary: Identidad del servicio
      responses:
        '200':
          description: OK
  /health:
    get:
      tags: [Sistema]
      summary: Estado del servicio (API + base de datos)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Estado' }
  /api/importar:
    post:
      tags: [Importación]
      summary: Importa un archivo Excel (.xlsx/.xls) o CSV de ventas
      description: >
        ADR-003: si el libro trae una hoja "productos" se importa primero el
        catálogo y luego la hoja "ventas".
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: Archivo subido en el campo 'file'
      responses:
        '200':
          description: Resumen de la importación
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResumenImportacion' }
        '400':
          description: Formato no soportado, campo 'file' ausente o columnas no reconocidas
  /api/productos:
    get:
      tags: [Productos]
      summary: Lista de productos
      responses:
        '200':
          description: Lista de productos ordenada por nombre
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Producto' }
    post:
      tags: [Productos]
      summary: Alta manual de un producto (RF-07)
      description: >
        Si no se envía 'sku' se genera uno único a partir del nombre. Un SKU
        repetido devuelve 409 en lugar de sobrescribir el producto existente.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductoEntrada' }
      responses:
        '201':
          description: Producto creado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Producto' }
        '409':
          description: Ya existe un producto con ese SKU
        '422':
          description: Cuerpo inválido (nombre vacío, precio o stock negativos)
  /api/productos/{producto_id}:
    put:
      tags: [Productos]
      summary: Edición manual de un producto (RF-07)
      description: >
        Sustituye los campos editables. Si no se envía 'sku' se conserva el
        actual; un SKU que pertenezca a otro producto devuelve 409.
      parameters:
        - name: producto_id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductoEntrada' }
      responses:
        '200':
          description: Producto actualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Producto' }
        '404':
          description: Producto no encontrado
        '409':
          description: El SKU pertenece a otro producto
        '422':
          description: Cuerpo inválido (nombre vacío, precio o stock negativos)
  /api/kpis:
    get:
      tags: [Análisis]
      summary: KPIs generales del negocio (RF-09)
      responses:
        '200':
          description: KPIs calculados sobre SQLite
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KPIs' }
  /api/rotacion:
    get:
      tags: [Análisis]
      summary: Rotación por producto, baja rotación y productos sin ventas (RF-11 a RF-13)
      description: >
        La ventana de venta por defecto es de 30 días anclada en la última
        venta registrada. dias_cobertura = stock / venta_diaria_media (null si
        no hay ventas en la ventana).
      responses:
        '200':
          description: Datos de rotación
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Rotacion' }
  /api/predicciones/{producto_id}:
    get:
      tags: [Análisis]
      summary: Predicción de demanda de un producto para 7, 14 y 30 días (RF-18 a RF-20)
      parameters:
        - { in: path, name: producto_id, required: true, schema: { type: integer } }
      responses:
        '200':
          description: Predicción por media móvil simple
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Prediccion' }
        '400':
          description: Histórico de ventas insuficiente para el producto
        '404':
          description: Producto no encontrado
  /api/recomendaciones:
    get:
      tags: [Análisis]
      summary: Lista de compra sugerida para esta semana (RF-22 a RF-27)
      parameters:
        - { in: query, name: lead_time, schema: { type: integer, default: 7 }, description: Días de entrega del proveedor }
      responses:
        '200':
          description: Recomendaciones ordenadas por urgencia
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Recomendaciones' }
  /api/abc:
    get:
      tags: [Análisis]
      summary: Clasificación ABC del inventario (RF-15)
      description: A = 80% del valor, B = 15%, C = 5%, sobre stock * precio de venta.
      responses:
        '200':
          description: Productos agrupados por clase
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ABC' }
  /api/capital:
    get:
      tags: [Análisis]
      summary: Capital inmovilizado en inventario por producto (RF-17)
      responses:
        '200':
          description: Capital inmovilizado (stock * costo)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Capital' }
  /api/estacionalidad:
    get:
      tags: [Análisis]
      summary: Detectar patrones estacionales de ventas (RF-14)
      parameters:
        - { in: query, name: producto, schema: { type: string }, description: Nombre opcional para analizar un solo producto }
      responses:
        '200':
          description: Estacionalidad detectada (o "sin_datos"/"insuficiente_datos")
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Estacionalidad' }
  /api/alertas:
    get:
      tags: [Alertas]
      summary: Alertas de riesgo de agotamiento y comportamientos inusuales (RF-28, RF-29)
      responses:
        '200':
          description: Alertas agrupadas por tipo
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Alertas' }
  /api/chat:
    post:
      tags: [Chat IA]
      summary: Pregunta al asistente con IA local (Ollama)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChatRequest' }
      responses:
        '200':
          description: Respuesta del asistente (siempre 200; si Ollama no responde, la respuesta explica el fallo y adjunta el contexto JSON)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChatResponse' }
        '400':
          description: Cuerpo ausente o mensaje vacío
components:
  schemas:
    Estado:
      type: object
      properties:
        status: { type: string, example: 'ok' }
        database: { type: string, example: 'connected' }
    Producto:
      type: object
      properties:
        id: { type: integer }
        sku: { type: string, nullable: true }
        nombre: { type: string }
        categoria: { type: string, nullable: true }
        unidad: { type: string, nullable: true, description: 'Unidad de medida (kg, unidad, caja...) — RF-07' }
        costo: { type: number, nullable: true }
        precio_venta: { type: number, nullable: true }
        stock_actual: { type: number }
        stock_minimo: { type: number }
      required: [id, nombre]
    KPIs:
      type: object
      properties:
        ventas_totales: { type: number }
        ticket_promedio: { type: number }
        unidades_vendidas: { type: integer }
        margen_total: { type: number }
        top_productos:
          type: array
          items: { type: object }
    Rotacion:
      type: object
      properties:
        productos:
          type: array
          description: Uno por producto del catálogo
          items:
            type: object
            properties:
              id: { type: integer }
              nombre: { type: string }
              stock_actual: { type: number }
              total_vendido: { type: integer, description: Histórico de unidades vendidas }
              total_vendido_30d: { type: integer, description: Unidades vendidas en la ventana (30 días por defecto) }
              dias_desde_ultima_venta: { type: integer, nullable: true }
              indice_rotacion: { type: number, description: Unidades/mes normalizado a 30 días }
              dias_cobertura: { type: number, nullable: true, description: stock / venta_diaria_media; null si no hay ventas en la ventana }
        baja_rotacion:
          type: array
          items:
            type: object
            properties:
              id: { type: integer }
              nombre: { type: string }
              stock_actual: { type: number }
              razon: { type: string, enum: [sin_ventas, baja_rotacion] }
        muertos:
          type: array
          description: Nombres sin ventas registradas nunca
          items: { type: string }
    Prediccion:
      type: object
      properties:
        producto_id: { type: integer }
        producto: { type: string }
        predicciones:
          type: object
          properties:
            '7_dias': { type: integer }
            '14_dias': { type: integer }
            '30_dias': { type: integer }
        metodo: { type: string, example: media_movil_simple }
        historico_dias: { type: integer }
        ultima_actualizacion: { type: string, format: date-time }
    Recomendaciones:
      type: object
      properties:
        recomendaciones:
          type: array
          items: { $ref: '#/components/schemas/Recomendacion' }
        total_analizados: { type: integer }
        total_recomendado: { type: integer }
        lead_time_asumido: { type: integer }
        fecha_referencia_demanda: { type: string, format: date }
    Recomendacion:
      type: object
      properties:
        producto_id: { type: integer }
        producto: { type: string }
        stock_actual: { type: number }
        stock_minimo: { type: number }
        demanda_proyectada: { type: integer }
        cantidad_sugerida: { type: integer }
        punto_reorden: { type: integer }
        punto_reorden_detalle: { type: string }
        urgencia: { type: string, enum: [crítico, medio, bajo] }
        fecha_sugerida: { type: string, format: date }
        fecha_entrega_estimada: { type: string, format: date }
        valor_inventario: { type: number }
        lead_time_dias: { type: integer }
    ABC:
      type: object
      properties:
        clases:
          type: object
          description: Claves A, B y C; cada una con su lista de productos
          properties:
            A: { type: array, items: { type: object } }
            B: { type: array, items: { type: object } }
            C: { type: array, items: { type: object } }
        total_productos: { type: integer }
        total_valor_inventario: { type: number }
    Capital:
      type: object
      properties:
        por_producto:
          type: object
          additionalProperties:
            type: object
            properties:
              stock: { type: number }
              costo_unitario: { type: number }
              precio_venta: { type: number }
              capital: { type: number }
        total_capital_inmovilizado: { type: number }
    Estacionalidad:
      type: object
      properties:
        estacional: { type: boolean }
        patron: { type: string, example: 'peak_en_mes_10' }
        promedios_mensuales:
          type: object
          additionalProperties: { type: number }
    Alertas:
      type: object
      properties:
        riesgo_agotamiento:
          type: array
          items:
            type: object
            properties:
              producto_id: { type: integer }
              producto: { type: string }
              stock_actual: { type: number }
              stock_minimo: { type: number }
              riesgo: { type: string, enum: [agotamiento_inminente, agotamiento_pronto] }
              dias_estimados: { type: integer, nullable: true }
              valor_inventario: { type: number }
        comportamiento:
          type: object
          description: Resultado del análisis de anomalías (picos/caídas)
          properties:
            alerta: { type: boolean }
            media_diaria: { type: number }
            desviacion_std: { type: number }
            picos_detectados: { type: integer }
            caidas_detectadas: { type: integer }
    ResumenImportacion:
      type: object
      properties:
        archivo_origen: { type: string }
        total_ventas: { type: integer, description: Ventas importadas }
        productos_creados: { type: integer, description: 'Productos creados desde la hoja "productos" o desde las ventas' }
        productos_actualizados: { type: integer, description: 'Productos actualizados desde la hoja "productos"' }
        ventas_duplicadas_omitidas: { type: integer, description: 'Ventas ya presentes en la BD que no se volvieron a insertar (RF-05)' }
        errores:
          type: array
          items: { type: string }
    ChatRequest:
      type: object
      properties:
        mensaje: { type: string }
        historial:
          type: array
          description: Mensajes anteriores de la conversación (opcional; se usan los últimos 6)
          items:
            type: object
            properties:
              rol: { type: string, enum: [usuario, asistente] }
              contenido: { type: string }
      required: [mensaje]
    ChatResponse:
      type: object
      properties:
        respuesta: { type: string }
        herramientas:
          type: object
          description: Datos reales usados como contexto (KPIs, recomendaciones, alertas)
        contexto: { type: object }
        modelo: { type: string, nullable: true, example: 'qwen3:1.7b', description: 'null si Ollama no respondió' }
    ProductoEntrada:
      type: object
      description: Cuerpo de alta o edición manual de un producto (RF-07)
      properties:
        nombre: { type: string, minLength: 1, maxLength: 200 }
        sku: { type: string, nullable: true, description: 'Si se omite en el alta se genera uno único' }
        categoria: { type: string, nullable: true }
        unidad: { type: string, nullable: true }
        costo: { type: number, minimum: 0, default: 0 }
        precio_venta: { type: number, minimum: 0, default: 0 }
        stock_actual: { type: integer, minimum: 0, default: 0 }
        stock_minimo: { type: integer, minimum: 0, default: 0 }
      required: [nombre]
